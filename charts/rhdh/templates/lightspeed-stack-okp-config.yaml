kind: ConfigMap
apiVersion: v1
metadata:
  name: lightspeed-stack-okp
  namespace: {{ .Release.Namespace }}
data:
  lightspeed-stack.yaml: |
    name: lightspeed-core-stack
    service:
      host: ${env.SERVICE_HOST:=127.0.0.1}
      port: 8080
      auth_enabled: false
      workers: 1
      color_log: true
      access_log: true
    llama_stack:
      use_as_library_client: true
      library_client_config_path: /app-root/config.yaml
    user_data_collection:
      feedback_enabled: true
      feedback_storage: '/tmp/data/feedback'
    authentication:
      module: 'noop'
    conversation_cache:
      type: 'sqlite'
      sqlite:
        db_path: '/tmp/cache.db'
    customization:
      profile_path: '/app-root/rhdh-profile.py'
    mcp_servers:
      - name: mcp-integration-tools
        provider_id: 'model-context-protocol'
        url: 'http://localhost:7007/api/mcp-actions/v1'
        authorization_headers:
          Authorization: 'client'
    rag:
      inline:
        - okp
      tool:
        - vs_757285d9-b657-4bed-b18c-3359844e8c0d
    okp:
      rhokp_url: http://okp-svc.{{ .Release.Namespace }}.svc.cluster.local:8983
      offline: true
      chunk_filter_query: "product:*developer_hub*"
