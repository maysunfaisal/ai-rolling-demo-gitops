apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-policy
data:
  rbac-policy.csv: |
    # RBAC Policy for MCP Authorization
    # Format: p, <role>, <permission>, <action>, <allow|deny>
    #          g, <user/group entity ref>, <role>

    # --- MCP Reader: read-only catalog access + lightspeed ---
    p, role:default/mcp-reader, catalog.entity.read, read, allow
    p, role:default/mcp-reader, catalog.entity.create, create, deny
    p, role:default/mcp-reader, catalog.entity.delete, delete, deny
    p, role:default/mcp-reader, catalog.entity.refresh, update, allow
    p, role:default/mcp-reader, catalog.location.read, read, allow
    p, role:default/mcp-reader, catalog.location.create, create, deny
    p, role:default/mcp-reader, lightspeed.chat.read, read, allow
    p, role:default/mcp-reader, lightspeed.chat.create, create, allow
    p, role:default/mcp-reader, lightspeed.chat.delete, delete, allow
    p, role:default/mcp-reader, lightspeed.chat.update, update, allow
    p, role:default/mcp-reader, lightspeed.mcp.read, read, allow
    p, role:default/mcp-reader, lightspeed.mcp.manage, update, allow
    p, role:default/mcp-reader, lightspeed.notebooks.use, update, allow

    # --- MCP Admin: full catalog access + lightspeed ---
    p, role:default/mcp-admin, catalog.entity.read, read, allow
    p, role:default/mcp-admin, catalog.entity.create, create, allow
    p, role:default/mcp-admin, catalog.entity.delete, delete, allow
    p, role:default/mcp-admin, catalog.entity.refresh, update, allow
    p, role:default/mcp-admin, catalog.location.read, read, allow
    p, role:default/mcp-admin, catalog.location.create, create, allow
    p, role:default/mcp-admin, lightspeed.chat.read, read, allow
    p, role:default/mcp-admin, lightspeed.chat.create, create, allow
    p, role:default/mcp-admin, lightspeed.chat.delete, delete, allow
    p, role:default/mcp-admin, lightspeed.chat.update, update, allow
    p, role:default/mcp-admin, lightspeed.mcp.read, read, allow
    p, role:default/mcp-admin, lightspeed.mcp.manage, update, allow
    p, role:default/mcp-admin, lightspeed.notebooks.use, update, allow

    # --- User -> Role assignments ---
    # Assign your Keycloak user to mcp-reader (read-only MCP access)
    g, user:default/mfaisal, role:default/mcp-reader
